services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: possandbox
    ports: ["55432:5432"]
    volumes: ["pos-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d possandbox"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  pos-db:
